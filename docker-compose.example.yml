services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpa_usage_keeper}
      POSTGRES_USER: ${POSTGRES_USER:-keeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cpa-usage-keeper:
    image: ghcr.io/shay-wong/cpa-usage-keeper:latest
    ports:
      - "8080:8080"
    environment:
      CPA_BASE_URL: ${CPA_BASE_URL}
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY}
      DATABASE_DRIVER: ${DATABASE_DRIVER:-postgres}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-168h}
      APP_PORT: ${APP_PORT:-8080}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_QUEUE_ADDR: ${REDIS_QUEUE_ADDR:-}
      REDIS_QUEUE_TLS: ${REDIS_QUEUE_TLS:-false}
      REDIS_QUEUE_BATCH_SIZE: ${REDIS_QUEUE_BATCH_SIZE:-10000}
      REDIS_QUEUE_IDLE_INTERVAL: ${REDIS_QUEUE_IDLE_INTERVAL:-1s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30s}
      TLS_SKIP_VERIFY: ${TLS_SKIP_VERIFY:-false}
      WORK_DIR: ${WORK_DIR:-./data}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED:-true}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:

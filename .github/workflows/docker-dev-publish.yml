name: Publish dev Docker image

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  docker-dev-ghcr:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    outputs:
      image: ${{ steps.repo.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Convert image name to lowercase
        id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY@L}" >> "$GITHUB_OUTPUT"

      - name: Generate GHCR Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-dev-dockerhub:
    runs-on: ubuntu-latest
    needs: docker-dev-ghcr
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Generate Docker Hub metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/shaywong/cpa-usage-keeper
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "$DOCKERHUB_TOKEN" | skopeo login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Copy GHCR image to Docker Hub
        env:
          SOURCE_DIGEST: ${{ needs.docker-dev-ghcr.outputs.digest }}
          SOURCE_IMAGE: ${{ needs.docker-dev-ghcr.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          source_ref="docker://${SOURCE_IMAGE}@${SOURCE_DIGEST}"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            skopeo copy --all "$source_ref" "docker://${tag}"
          done <<< "$TAGS"
